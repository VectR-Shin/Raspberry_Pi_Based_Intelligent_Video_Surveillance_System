<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team5 - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #eaf3ff, #d6e7ff);
            color: #1e293b;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 55px 45px;
            margin: 20px;
            text-align: center;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(37, 99, 235, 0.12);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            background: #2563eb;
            color: #ffffff;
            font-size: 27px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        h1 {
            margin-bottom: 12px;
            font-size: 30px;
            font-weight: 800;
            color: #1e40af;
            letter-spacing: -1px;
        }

        .description {
            margin-bottom: 38px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }

        .login-button {
            width: 100%;
            height: 54px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .login-button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(37, 99, 235, 0.25);
        }

        .google-icon {
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            color: #4285F4;
            font-size: 14px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer {
            margin-top: 35px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 45px 28px;
            }
        }
    </style>
</head>

<body>

<main class="login-container">

    <div class="logo">T</div>

    <h1>TEAM5</h1>

    <p class="description">
        안전하고 편리한 서비스 이용을 위해<br>
        Google 계정으로 로그인해 주세요.
    </p>

    <a class="login-button"
       href="/oauth2/authorization/keycloak">
        <span class="google-icon">G</span>
        Google 계정으로 로그인
    </a>

    <div class="footer">
        © 2026 Team5. All rights reserved.
    </div>

</main>

</body>
</html>
