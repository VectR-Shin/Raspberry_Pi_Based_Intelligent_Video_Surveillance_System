
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team5 - Main</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <style>
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .page-title {
            margin-bottom: 24px;
        }

        .page-title h1 {
            margin-bottom: 8px;
        }

        .search-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .search-field label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .search-field input,
        .search-field select {
            height: 40px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            padding: 20px;
            margin-bottom: 20px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .search-section input,
        .search-section select {
            height: 40px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-section input {
            width: 220px;
        }

        .search-section button,
        .pagination button,
        .image-button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .search-button {
            height: 40px;
            padding: 0 20px;
            color: white;
            background: #2563eb;
        }

        .reset-button {
            height: 40px;
            padding: 0 16px;
            color: #374151;
            background: #e5e7eb;
        }

        .log-section {
            overflow-x: auto;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            white-space: nowrap;
        }

        .log-table th,
        .log-table td {
            padding: 15px 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .log-table th {
            color: #374151;
            background: #f9fafb;
            font-size: 14px;
        }

        .log-table td {
            color: #4b5563;
            font-size: 14px;
        }

        .event-person {
            color: #2563eb;
            font-weight: 600;
        }

        .event-obstructed {
            color: #dc2626;
            font-weight: 600;
        }

        .image-button {
            padding: 7px 12px;
            color: #2563eb;
            background: #eff6ff;
        }

        .image-button:hover {
            background: #dbeafe;
        }

        .empty-message {
            padding: 40px !important;
            color: #9ca3af !important;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 24px 0;
        }

        .pagination button {
            min-width: 36px;
            height: 36px;
            padding: 0 10px;
            color: #4b5563;
            background: #fff;
            border: 1px solid #e5e7eb;
        }

        .pagination button.active {
            color: #fff;
            background: #2563eb;
            border-color: #2563eb;
        }

        .pagination button:disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }

        .page-info {
            margin-bottom: 12px;
            color: #6b7280;
            font-size: 14px;
        }

        /* 이미지 모달 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.65);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 900px;
            max-height: 90vh;
            padding: 20px;
            background: white;
            border-radius: 14px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .modal-close {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            background: #f3f4f6;
            cursor: pointer;
            font-size: 20px;
        }

        .modal-content img {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            margin: auto;
            object-fit: contain;
        }

        .modal-message {
            padding: 40px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 600px) {
            main {
                padding: 0 12px;
            }

            .search-section {
                align-items: stretch;
                flex-direction: column;
            }

            .search-section input,
            .search-section select {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

<!-- 공통 헤더: main 페이지에서는 기기 버튼 표시 -->
<header th:replace="~{fragments/header :: header('main')}"></header>

<main>
    <section class="page-title">
        <h1>로그 조회 및 검색</h1>
        <p>카메라 감지 로그를 조회하고 확인할 수 있습니다.</p>
    </section>

    <!-- 검색 영역 -->
    <section class="search-section">
        <div class="search-field">
            <label for="startDate">시작일</label>
            <input type="date" id="startDate">
        </div>

        <div class="search-field">
            <label for="endDate">종료일</label>
            <input type="date" id="endDate">
        </div>

        <div class="search-field">
            <label for="alias">기기 별칭</label>
            <input
                    type="text"
                    id="alias"
                    placeholder="기기 별칭 입력"
            >
        </div>

        <div class="search-field">
            <label for="eventType">로그 유형</label>
            <select id="eventType">
                <option value="">전체</option>
                <option value="PERSON_DETECTED">사람 감지</option>
                <option value="CAMERA_OBSTRUCTED">카메라 가림</option>
            </select>
        </div>

        <button class="search-button" onclick="searchLogs()">
            검색
        </button>

        <button class="reset-button" onclick="resetSearch()">
            초기화
        </button>
    </section>

    <!-- 로그 목록 -->
    <section>
        <div class="page-info" id="pageInfo">
            로그를 불러오는 중입니다.
        </div>

        <div class="log-section">
            <table class="log-table">
                <thead>
                <tr>
                    <th>로그 ID</th>
                    <th>기기 식별자</th>
                    <th>기기 별칭</th>
                    <th>이벤트 종류</th>
                    <th>감지 시각</th>
                    <th>이미지</th>
                </tr>
                </thead>

                <tbody id="logTableBody">
                <tr>
                    <td colspan="6" class="empty-message">
                        로그를 불러오는 중입니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination" id="pagination"></div>
    </section>
</main>

<!-- 이미지 모달 -->
<div class="modal" id="imageModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">이벤트 이미지</h2>

            <button class="modal-close" onclick="closeImageModal()">
                &times;
            </button>
        </div>

        <div id="modalBody">
            <p class="modal-message">이미지를 불러오는 중입니다.</p>
        </div>
    </div>
</div>

<script>
    const LOG_API = '/api/logs';
    const IMAGE_API = '/api/images';

    const PAGE_SIZE = 20;

    let currentPage = 0;
    let currentImageUrl = null;

    let currentSearch = {
        startDate: '',
        endDate: '',
        alias: '',
        eventType: ''
    };

    document.addEventListener('DOMContentLoaded', () => {
        loadLogs(0);
    });

    // 로그 조회
    async function loadLogs(page) {
        const params = new URLSearchParams({
            page: page,
            size: PAGE_SIZE
        });

        // 검색 조건이 지정된 경우에만 파라미터 추가
        Object.entries(currentSearch).forEach(([key, value]) => {
            if (value) {
                params.append(key, value);
            }
        });

        const tbody = document.getElementById('logTableBody');

        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="empty-message">
                    로그를 불러오는 중입니다.
                </td>
            </tr>
        `;

        try {
            const response = await fetch(`${LOG_API}?${params}`);

            if (!response.ok) {
                throw new Error('로그 조회에 실패했습니다.');
            }

            const data = await response.json();

            currentPage = data.page;

            renderLogs(data.content);
            renderPageInfo(data);
            renderPagination(data);

        } catch (error) {
            console.error(error);

            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="empty-message">
                        ${escapeHtml(error.message)}
                    </td>
                </tr>
            `;

            document.getElementById('pageInfo').textContent = '';
            document.getElementById('pagination').innerHTML = '';
        }
    }

    // 로그 테이블 출력
    function renderLogs(logs) {
        const tbody = document.getElementById('logTableBody');

        if (!logs || logs.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="empty-message">
                        조회된 로그가 없습니다.
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = logs.map(log => {
            const eventLabel =
                log.eventType === 'PERSON_DETECTED'
                    ? '사람 감지'
                    : '카메라 가림';

            const eventClass =
                log.eventType === 'PERSON_DETECTED'
                    ? 'event-person'
                    : 'event-obstructed';

            const detectedAt = formatDate(log.detectedAt);

            return `
                <tr>
                    <td>${log.id}</td>
                    <td>${escapeHtml(log.deviceIdentifier)}</td>
                    <td>${escapeHtml(log.alias ?? '-')}</td>
                    <td class="${eventClass}">${eventLabel}</td>
                    <td>${detectedAt}</td>
                    <td>
                        ${
                log.imageId
                    ? `<button
                                        class="image-button"
                                        onclick="openImageModal(${log.imageId})">
                                        이미지 보기
                                   </button>`
                    : '-'
            }
                    </td>
                </tr>
            `;
        }).join('');
    }

    // 페이지 정보 출력
    function renderPageInfo(data) {
        document.getElementById('pageInfo').textContent =
            `전체 ${data.totalElements}건 · ` +
            `${data.totalPages === 0 ? 0 : data.page + 1} / ${data.totalPages} 페이지`;
    }

    // 페이지네이션 출력
    function renderPagination(data) {
        const pagination = document.getElementById('pagination');

        pagination.innerHTML = '';

        if (data.totalPages <= 1) {
            return;
        }

        const startPage = Math.floor(data.page / 5) * 5;
        const endPage = Math.min(startPage + 5, data.totalPages);

        // 이전 페이지
        const prevButton = document.createElement('button');
        prevButton.textContent = '이전';
        prevButton.disabled = data.page === 0;
        prevButton.onclick = () => loadLogs(data.page - 1);

        pagination.appendChild(prevButton);

        // 페이지 번호
        for (let i = startPage; i < endPage; i++) {
            const button = document.createElement('button');

            button.textContent = i + 1;

            if (i === data.page) {
                button.classList.add('active');
            }

            button.onclick = () => loadLogs(i);

            pagination.appendChild(button);
        }

        // 다음 페이지
        const nextButton = document.createElement('button');
        nextButton.textContent = '다음';
        nextButton.disabled = data.page >= data.totalPages - 1;
        nextButton.onclick = () => loadLogs(data.page + 1);

        pagination.appendChild(nextButton);
    }

    // 검색
    function searchLogs() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;

        // 기간 유효성 검사
        if (startDate && endDate && startDate > endDate) {
            alert('시작일은 종료일보다 늦을 수 없습니다.');
            return;
        }

        currentSearch = {
            startDate: startDate,
            endDate: endDate,
            alias: document.getElementById('alias').value.trim(),
            eventType: document.getElementById('eventType').value
        };

        // 검색 조건 변경 시 첫 페이지부터 조회
        loadLogs(0);
    }

    // 검색 초기화
    function resetSearch() {
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        document.getElementById('alias').value = '';
        document.getElementById('eventType').value = '';

        currentSearch = {
            startDate: '',
            endDate: '',
            alias: '',
            eventType: ''
        };

        loadLogs(0);
    }

    // 이미지 모달 열기
    async function openImageModal(imageId) {
        const modal = document.getElementById('imageModal');
        const modalBody = document.getElementById('modalBody');

        modal.classList.add('show');

        document.getElementById('modalTitle').textContent =
            `감지된 이미지`;

        modalBody.innerHTML = `
            <p class="modal-message">
                이미지를 불러오는 중입니다.
            </p>
        `;

        try {
            const response = await fetch(`${IMAGE_API}/${imageId}`);

            if (!response.ok) {
                throw new Error('이미지를 불러오지 못했습니다.');
            }

            const blob = await response.blob();

            if (!blob.type.startsWith('image/')) {
                throw new Error('올바른 이미지 응답이 아닙니다.');
            }

            // 기존 이미지 URL 정리
            if (currentImageUrl) {
                URL.revokeObjectURL(currentImageUrl);
            }

            currentImageUrl = URL.createObjectURL(blob);

            modalBody.innerHTML = '';

            const img = document.createElement('img');
            img.src = currentImageUrl;
            img.alt = `이벤트 이미지 ${imageId}`;

            modalBody.appendChild(img);

        } catch (error) {
            console.error(error);

            modalBody.innerHTML = `
                <p class="modal-message">
                    ${escapeHtml(error.message)}
                </p>
            `;
        }
    }

    // 이미지 모달 닫기
    function closeImageModal() {
        document.getElementById('imageModal').classList.remove('show');

        if (currentImageUrl) {
            URL.revokeObjectURL(currentImageUrl);
            currentImageUrl = null;
        }
    }

    // 모달 바깥 영역 클릭 시 닫기
    document.getElementById('imageModal').addEventListener('click', event => {
        if (event.target.id === 'imageModal') {
            closeImageModal();
        }
    });

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
            closeImageModal();
        }
    });

    // 날짜 변환
    function formatDate(dateString) {
        if (!dateString) return '-';

        return new Date(dateString).toLocaleString('ko-KR', {
            timeZone: 'Asia/Seoul',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });
    }

    // HTML 삽입 시 문자열 이스케이프
    function escapeHtml(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }
</script>

</body>
</html>
