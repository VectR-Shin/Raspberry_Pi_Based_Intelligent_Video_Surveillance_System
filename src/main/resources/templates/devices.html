<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기기 관리 | TEAM5</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Pretendard, "Noto Sans KR", sans-serif;
            letter-spacing: -1px;
            color: #1e293b;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
        }

        /* Header */

        .site-header {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid #dbeafe;
        }

        /* Main */

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-title {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            color: #1e293b;
        }

        .page-description {
            margin-top: 10px;
            font-size: 15px;
            color: #64748b;
        }

        /* Buttons */

        .button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .primary-button {
            background: #2563eb;
            color: white;
        }

        .primary-button:hover {
            background: #1d4ed8;
        }

        .secondary-button {
            background: white;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .secondary-button:hover {
            background: #f8fafc;
        }

        .danger-button {
            background: #ef4444;
            color: white;
        }

        .danger-button:hover {
            background: #dc2626;
        }

        /* Card */

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.04);
        }

        /* Search */

        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Device List */

        .device-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .device-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 22px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            transition: all 0.2s ease;
        }

        .device-item:hover {
            border-color: #bfdbfe;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.05);
        }

        .device-info {
            min-width: 0;
        }

        .device-alias {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .device-identifier {
            font-size: 14px;
            color: #64748b;
            word-break: break-all;
        }

        .device-date {
            margin-top: 8px;
            font-size: 13px;
            color: #94a3b8;
        }

        .device-actions {
            display: flex;
            flex-shrink: 0;
            gap: 8px;
        }

        .device-actions .button {
            padding: 10px 14px;
        }

        /* Pagination */

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
        }

        .page-button {
            min-width: 38px;
            height: 38px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background: white;
            color: #475569;
            font-weight: 600;
            cursor: pointer;
        }

        .page-button:hover:not(:disabled) {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .page-button.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .page-button:disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }

        /* Empty / Loading */

        .empty-message {
            text-align: center;
            padding: 70px 20px;
            color: #94a3b8;
        }

        .empty-message strong {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
            color: #475569;
        }

        .loading-message {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        /* Modal */

        .modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.45);
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 460px;
            padding: 28px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.2);
        }

        .modal-title {
            margin: 0 0 24px;
            font-size: 22px;
            font-weight: 800;
            color: #1e293b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #475569;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-help {
            margin-top: 7px;
            font-size: 12px;
            color: #94a3b8;
        }

        .modal-description {
            margin-bottom: 24px;
            line-height: 1.6;
            font-size: 14px;
            color: #64748b;
            word-break: break-word;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        /* Toast */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            padding: 14px 20px;
            border-radius: 12px;
            background: #1e293b;
            color: white;
            font-size: 14px;
            z-index: 2000;
            display: none;
            max-width: calc(100% - 40px);
            text-align: center;
        }

        .toast.show {
            display: block;
        }

        /* Responsive */

        @media (max-width: 768px) {
            .container {
                padding: 28px 16px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-title {
                font-size: 26px;
            }

            .card {
                padding: 20px;
            }

            .device-item {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }

            .device-actions {
                width: 100%;
            }

            .device-actions .button {
                flex: 1;
            }

            .search-area {
                flex-wrap: wrap;
            }

            .search-input {
                flex-basis: 100%;
            }

            .pagination {
                flex-wrap: wrap;
            }

            .modal {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

<!-- 공통 헤더 -->
<header th:replace="~{fragments/header :: header('devices')}"></header>

<main class="container">

    <!-- 페이지 제목 -->
    <div class="page-header">
        <div>
            <h1 class="page-title">기기 관리</h1>
            <p class="page-description">
                등록된 기기를 조회하고 관리할 수 있습니다.
            </p>
        </div>

        <button type="button"
                class="button primary-button"
                onclick="openRegisterModal()">
            + 기기 등록
        </button>
    </div>

    <!-- 기기 목록 -->
    <section class="card">

        <!-- 검색 -->
        <div class="search-area">
            <input type="text"
                   id="searchAlias"
                   class="search-input"
                   placeholder="기기 별칭으로 검색">

            <button type="button"
                    class="button primary-button"
                    onclick="searchDevices()">
                검색
            </button>

            <button type="button"
                    class="button secondary-button"
                    onclick="resetSearch()">
                초기화
            </button>
        </div>

        <!-- 목록 -->
        <div id="deviceList" class="device-list">
            <div class="loading-message">
                기기 목록을 불러오는 중입니다.
            </div>
        </div>

        <!-- 페이지네이션 -->
        <div id="pagination" class="pagination"></div>

    </section>

</main>

<!-- 기기 등록 모달 -->
<div id="registerModal" class="modal-overlay">
    <div class="modal">

        <h2 class="modal-title">기기 등록</h2>

        <form id="registerForm">

            <div class="form-group">
                <label class="form-label" for="registerIdentifier">
                    기기 식별자
                </label>

                <input type="text"
                       id="registerIdentifier"
                       class="form-input"
                       maxlength="50"
                       placeholder="기기 식별자를 입력하세요"
                       required>
            </div>

            <div class="form-group">
                <label class="form-label" for="registerAlias">
                    별칭
                </label>

                <input type="text"
                       id="registerAlias"
                       class="form-input"
                       maxlength="20"
                       placeholder="별칭 (선택)">

                <div class="form-help">
                    별칭은 최대 20자까지 입력할 수 있습니다.
                </div>
            </div>

            <div class="modal-actions">
                <button type="button"
                        class="button secondary-button"
                        onclick="closeRegisterModal()">
                    취소
                </button>

                <button type="submit"
                        class="button primary-button">
                    등록
                </button>
            </div>

        </form>
    </div>
</div>

<!-- 별칭 수정 모달 -->
<div id="aliasModal" class="modal-overlay">
    <div class="modal">

        <h2 class="modal-title">별칭 수정</h2>

        <form id="aliasForm">

            <input type="hidden" id="aliasDeviceId">

            <div class="form-group">
                <label class="form-label" for="newAlias">
                    새 별칭
                </label>

                <input type="text"
                       id="newAlias"
                       class="form-input"
                       maxlength="20"
                       placeholder="새 별칭을 입력하세요">
            </div>

            <div class="modal-actions">
                <button type="button"
                        class="button secondary-button"
                        onclick="closeAliasModal()">
                    취소
                </button>

                <button type="submit"
                        class="button primary-button">
                    수정
                </button>
            </div>

        </form>
    </div>
</div>

<!-- 기기 등록 해제 모달 -->
<div id="deleteModal" class="modal-overlay">
    <div class="modal">

        <h2 class="modal-title">기기 등록 해제</h2>

        <p id="deleteDescription" class="modal-description">
            해당 기기의 등록을 해제하시겠습니까?
        </p>

        <input type="hidden" id="deleteDeviceId">

        <div class="modal-actions">
            <button type="button"
                    class="button secondary-button"
                    onclick="closeDeleteModal()">
                취소
            </button>

            <button type="button"
                    class="button danger-button"
                    onclick="deleteDevice()">
                등록 해제
            </button>
        </div>

    </div>
</div>

<!-- 알림 -->
<div id="toast" class="toast"></div>

<script>
    let currentPage = 0;
    let currentAlias = '';
    const PAGE_SIZE = 10;

    // 최초 목록 조회
    document.addEventListener('DOMContentLoaded', () => {
        loadDevices();
    });

    // Enter 검색
    document.getElementById('searchAlias').addEventListener('keydown', event => {
        if (event.key === 'Enter') {
            searchDevices();
        }
    });

    // 기기 목록 조회
    async function loadDevices(page = currentPage) {

        currentPage = page;

        const params = new URLSearchParams();
        params.append('page', page);

        if (currentAlias.trim() !== '') {
            params.append('alias', currentAlias.trim());
        }

        const deviceList = document.getElementById('deviceList');

        deviceList.innerHTML = `
            <div class="loading-message">
                기기 목록을 불러오는 중입니다.
            </div>
        `;

        try {
            const response = await fetch(`/api/devices?${params.toString()}`);

            if (!response.ok) {
                throw new Error(await getErrorMessage(response));
            }

            const data = await response.json();

            renderDevices(data.content);
            renderPagination(data);

        } catch (error) {
            deviceList.innerHTML = `
                <div class="empty-message">
                    <strong>목록을 불러오지 못했습니다.</strong>
                    ${escapeHtml(error.message)}
                </div>
            `;

            document.getElementById('pagination').innerHTML = '';
        }
    }

    // 목록 렌더링
    function renderDevices(devices) {

        const deviceList = document.getElementById('deviceList');

        if (!devices || devices.length === 0) {
            deviceList.innerHTML = `
                <div class="empty-message">
                    <strong>등록된 기기가 없습니다.</strong>
                    검색 조건에 맞는 기기가 없거나 등록된 기기가 없습니다.
                </div>
            `;
            return;
        }

        deviceList.innerHTML = devices.map(device => {

            const alias = device.alias
                ? escapeHtml(device.alias)
                : '별칭 없음';

            const registeredAt = formatDateTime(device.registeredAt);

            const deviceName = device.alias || device.deviceIdentifier;

            return `
                <div class="device-item">

                    <div class="device-info">
                        <div class="device-alias">
                            ${alias}
                        </div>

                        <div class="device-identifier">
                            ${escapeHtml(device.deviceIdentifier)}
                        </div>

                        <div class="device-date">
                            등록일 : ${registeredAt}
                        </div>
                    </div>

                    <div class="device-actions">

                        <button type="button"
                                class="button secondary-button"
                                data-action="edit"
                                data-device-id="${device.id}"
                                data-alias="${escapeHtml(device.alias ?? '')}">
                            별칭 수정
                        </button>

                        <button type="button"
                                class="button danger-button"
                                data-action="delete"
                                data-device-id="${device.id}"
                                data-device-name="${escapeHtml(deviceName)}">
                            등록 해제
                        </button>

                    </div>

                </div>
            `;
        }).join('');
    }

    // 기기 목록 버튼 이벤트 위임
    document.getElementById('deviceList').addEventListener('click', event => {

        const button = event.target.closest('button[data-action]');

        if (!button) {
            return;
        }

        const deviceId = button.dataset.deviceId;

        if (button.dataset.action === 'edit') {

            openAliasModal(
                deviceId,
                button.dataset.alias
            );

        } else if (button.dataset.action === 'delete') {

            openDeleteModal(
                deviceId,
                button.dataset.deviceName
            );
        }
    });

    // 페이지네이션
    function renderPagination(data) {

        const pagination = document.getElementById('pagination');

        pagination.innerHTML = '';

        if (data.totalPages <= 1) {
            return;
        }

        // 이전 페이지
        const prevButton = document.createElement('button');
        prevButton.className = 'page-button';
        prevButton.textContent = '‹';
        prevButton.disabled = data.page <= 0;

        prevButton.onclick = () => {
            loadDevices(data.page - 1);
        };

        pagination.appendChild(prevButton);

        // 페이지 번호
        for (let i = 0; i < data.totalPages; i++) {

            const pageButton = document.createElement('button');
            pageButton.className = 'page-button';
            pageButton.textContent = i + 1;

            if (i === data.page) {
                pageButton.classList.add('active');
            }

            pageButton.onclick = () => {
                loadDevices(i);
            };

            pagination.appendChild(pageButton);
        }

        // 다음 페이지
        const nextButton = document.createElement('button');
        nextButton.className = 'page-button';
        nextButton.textContent = '›';
        nextButton.disabled = data.page >= data.totalPages - 1;

        nextButton.onclick = () => {
            loadDevices(data.page + 1);
        };

        pagination.appendChild(nextButton);
    }

    // 검색
    function searchDevices() {

        currentAlias = document.getElementById('searchAlias').value.trim();
        currentPage = 0;

        loadDevices(0);
    }

    // 검색 초기화
    function resetSearch() {

        document.getElementById('searchAlias').value = '';

        currentAlias = '';
        currentPage = 0;

        loadDevices(0);
    }

    // 등록 모달
    function openRegisterModal() {
        document.getElementById('registerModal').classList.add('show');
    }

    function closeRegisterModal() {
        document.getElementById('registerModal').classList.remove('show');
        document.getElementById('registerForm').reset();
    }

    // 기기 등록
    document.getElementById('registerForm').addEventListener('submit', async event => {

        event.preventDefault();

        const deviceIdentifier =
            document.getElementById('registerIdentifier').value.trim();

        const alias =
            document.getElementById('registerAlias').value.trim();

        if (!deviceIdentifier) {
            showToast('기기 식별자를 입력해주세요.');
            return;
        }

        if (deviceIdentifier.length > 50) {
            showToast('기기 식별자는 50자 이내로 입력해주세요.');
            return;
        }

        if (!alias) {
            showToast('별칭을 입력해주세요.');
            return;
        }

        if (alias.length > 20) {
            showToast('별칭은 20자 이내로 입력해주세요.');
            return;
        }

        try {

            const response = await fetch('/api/devices', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    deviceIdentifier: deviceIdentifier,
                    alias: alias || null
                })
            });

            if (!response.ok) {
                throw new Error(await getErrorMessage(response));
            }

            closeRegisterModal();

            showToast('기기가 등록되었습니다.');

            currentPage = 0;
            loadDevices(0);

        } catch (error) {
            showToast(error.message);
        }
    });

    // 별칭 수정 모달
    function openAliasModal(deviceId, alias) {

        document.getElementById('aliasDeviceId').value = deviceId;
        document.getElementById('newAlias').value = alias ?? '';

        document.getElementById('aliasModal').classList.add('show');
    }

    function closeAliasModal() {

        document.getElementById('aliasModal').classList.remove('show');

        document.getElementById('aliasForm').reset();
    }

    // 별칭 수정
    document.getElementById('aliasForm').addEventListener('submit', async event => {

        event.preventDefault();

        const deviceId =
            document.getElementById('aliasDeviceId').value;

        const alias =
            document.getElementById('newAlias').value.trim();

        if (!alias) {
            showToast('별칭을 입력해주세요.');
            return;
        }

        if (alias.length > 20) {
            showToast('별칭은 20자 이내로 입력해주세요.');
            return;
        }

        try {

            const response = await fetch(`/api/devices/${deviceId}/alias`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    alias: alias
                })
            });

            if (!response.ok) {
                throw new Error(await getErrorMessage(response));
            }

            closeAliasModal();

            showToast('별칭이 수정되었습니다.');

            loadDevices(currentPage);

        } catch (error) {
            showToast(error.message);
        }
    });

    // 등록 해제 모달
    function openDeleteModal(deviceId, deviceName) {

        document.getElementById('deleteDeviceId').value = deviceId;

        document.getElementById('deleteDescription').textContent =
            `"${deviceName}" 기기의 등록을 해제하시겠습니까?`;

        document.getElementById('deleteModal').classList.add('show');
    }

    function closeDeleteModal() {

        document.getElementById('deleteModal').classList.remove('show');
    }

    // 등록 해제
    async function deleteDevice() {

        const deviceId =
            document.getElementById('deleteDeviceId').value;

        try {

            const response = await fetch(`/api/devices/${deviceId}`, {
                method: 'DELETE'
            });

            if (!response.ok) {
                throw new Error(await getErrorMessage(response));
            }

            closeDeleteModal();

            showToast('기기 등록이 해제되었습니다.');

            loadDevices(currentPage);

        } catch (error) {
            showToast(error.message);
        }
    }

    // 날짜 포맷
    function formatDateTime(dateTime) {

        if (!dateTime) {
            return '-';
        }

        const date = new Date(dateTime);

        if (isNaN(date.getTime())) {
            return escapeHtml(dateTime);
        }

        return date.toLocaleString('ko-KR', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
    }

    // 오류 메시지
    async function getErrorMessage(response) {

        try {
            const data = await response.json();

            return data.message
                || data.detail
                || '요청 처리에 실패했습니다.';

        } catch {
            return '요청 처리에 실패했습니다.';
        }
    }

    // HTML escape
    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // Toast
    let toastTimer;

    function showToast(message) {

        const toast = document.getElementById('toast');

        toast.textContent = message;
        toast.classList.add('show');

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // 모달 바깥 클릭
    document.querySelectorAll('.modal-overlay').forEach(modal => {

        modal.addEventListener('click', event => {

            if (event.target === modal) {
                modal.classList.remove('show');
            }
        });
    });

</script>

</body>
</html>
