
server:
  port: 8081

app:
  storage:
    image-dir: ./uploads/images

spring:
  application:
    name: team5

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:team5
    username: sa
    password:

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: team5
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - email
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/team5
